<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Rikz Portfolio{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#17202a;--muted:#5d6b7a;--line:#e3e7ec;--accent:#1f5f8b;
--good:#2e7d4f;--bad:#b3261e;--warn:#9a6700;--hl:#fff7e0;--c1:#1f5f8b;--c2:#3a9d8f;--c3:#e0a100;--c4:#c0504d;--c5:#7f6fb0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1419;--panel:#171e26;--ink:#e6edf3;--muted:#98a6b3;--line:#2a3440;
--accent:#6cb4e4;--good:#5cc98a;--bad:#ff8a80;--warn:#e3b341;--hl:#2b2612;--c1:#6cb4e4;--c2:#5fc4b6;--c3:#e8b930;--c4:#e57373;--c5:#a99be0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header.top{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 0}
header.top .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:28px 0 10px}
h3{font-size:15px;margin:16px 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;max-width:100%}
nav a{color:var(--accent);text-decoration:none;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .label{color:var(--muted);font-size:13px}
.kpi .val{font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .xl{font-size:12px;color:var(--muted)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:10em}
th{color:var(--muted);font-weight:600;font-size:13px}
tr.strong td{font-weight:600}
.xl-cell{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.badge.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.badge.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.badge.info{background:color-mix(in srgb,var(--muted) 15%,transparent);color:var(--muted)}
.changes{background:var(--hl);border:1px solid var(--line);border-radius:10px;padding:10px 16px}
.changes h3{font-size:13px;color:var(--muted);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.03em}
.changes ul{margin:0;padding-left:18px}
.changes li{margin:2px 0;overflow-wrap:anywhere}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:baseline}
.legend-table{margin-top:10px}
.legend-table td{border:0;padding:3px 4px}
svg.share{border-radius:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.grid2>*{min-width:0}
svg.chart{width:100%;height:auto}
svg .grid{stroke:var(--line);stroke-width:1}
svg .tick{fill:var(--muted);font-size:12px}
select{max-width:100%}
select,input,button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
button{background:var(--accent);color:#fff;border:0;cursor:pointer}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.error{color:var(--bad)}
ol.assume li,ul.notes li{margin:3px 0}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow-wrap:anywhere}
input[type=file]{max-width:100%}
@media print{body{background:#fff}}
{% block extra_css %}{% endblock %}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
