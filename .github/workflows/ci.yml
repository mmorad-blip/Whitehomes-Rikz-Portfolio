name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rikz
          POSTGRES_PASSWORD: rikz
          POSTGRES_DB: rikz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rikz" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries for PDF rendering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e '.[dev]'
      - name: Tests (SQLite)
        run: pytest -q
      - name: Storage tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://rikz:rikz@localhost:5432/rikz
        run: pytest -q tests/test_store.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rikz-portfolio:ci .
      - name: Smoke test
        run: |
          docker run --rm rikz-portfolio:ci rikz make-keys --role both > /dev/null
          docker run --rm rikz-portfolio:ci python -c "import weasyprint; weasyprint.HTML(string='<p>ok</p>').write_pdf()"
