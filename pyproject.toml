[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rikz"
version = "0.1.0"
description = "Whitehomes capital-market portfolio reporting for the Rikz board"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=5"]

[project.scripts]
rikz = "rikz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
