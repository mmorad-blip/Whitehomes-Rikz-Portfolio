[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rikz"
version = "0.1.0"
description = "Whitehomes capital-market portfolio reporting for the Rikz board"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "weasyprint>=61",
    "google-auth>=2.28",
    "requests>=2.31",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=5"]

[project.scripts]
rikz = "rikz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rikz.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
