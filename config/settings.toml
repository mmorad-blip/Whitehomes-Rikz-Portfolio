# Calculation settings and the investment policy the report measures against.
# Every value here is printed in the report's assumptions section.

[calculation]
days_per_year = 365
# Credit provision as a share of outstanding principal. Accounting view: 100%
# on defaulted notes until cash is recovered. The recovery view (0% loss) is
# always shown next to it.
provision_default = "1.00"
provision_delay = "0.00"
# Include pro-rata net profit earned to date on open positions in NAV.
accrue_open_profit = true
# Window for "due in the next N days".
upcoming_days = 30
# Forecast: expected loss per Manafa cycle. "observed" = defaulted principal
# net of recoveries ÷ principal funded; or a number such as "0.02" to override.
forecast_loss_per_cycle = "observed"
# PLACEHOLDER: latest 3-month SAIBOR. Official sources: the daily fixing from
# the SAIBOR administrator (published 12:00 KSA, Sun–Thu, via LSEG), or the
# monthly average in SAMA's Monthly Statistical Bulletin (sama.gov.sa). Enter
# it as a decimal (5.48% = "0.0548"), set benchmark_is_placeholder = false and
# fill in the as-of date and source. The report warns while it is a
# placeholder or older than 30 days.
benchmark_saibor = "0.05"
benchmark_is_placeholder = true
# benchmark_as_of = 2026-10-26
benchmark_source = ""
# Idle-cash flag in the Awaed chain: days from maturity to the next deposit.
awaed_idle_days = 3
# Money matured within this many days is excluded from the idle-cash check.
idle_grace_days = 20
# Matured Awaed money still waiting for a new deposit after this many days
# raises an alert on the Overview (separate from the idle-cash grace above).
rollover_alert_days = 2
# A defaulted position with no recovery is flagged written off after this many
# days past maturity. 0 = no automatic write-off: defaulted notes stay held
# until legal collection concludes and you set status = "written off" yourself.
writeoff_days = 0
# Awaed principal rounded up to the whole riyal: dips of the derived wallet
# below zero up to this amount are treated as unrecorded top-ups.
awaed_rounding_tolerance = "1.00"

# Collection status per defaulted position. expected = share of outstanding
# principal you expect to recover (0–1); status = in collection | legal |
# settled | written off.
[recovery."OID-1432-698593"]
expected = "0"
status = "in collection"
# last_action = 2026-10-01
last_action_note = ""

[policy]
budget_whitehomes = "215000"
budget_rikz = "35000"
target_return_low = "0.10"
target_return_high = "0.14"

[policy.allocation]
awaed = "0.40"
manafa = "0.60"
tier3 = "0.00"

[policy.expected_return]
# Expected annual return band per channel (policy allocation schedule).
awaed = ["0.037", "0.047"]
manafa = ["0.09", "0.15"]

[policy.limits]
max_single_manafa_position = "0.12"   # of Manafa NAV
max_troubled_exposure = "0.05"        # delayed + defaulted principal before provision, of total NAV
max_idle_cash = "0.10"                # of total NAV
min_liquidity = "0.20"                # cash + maturing within 30 days, of total NAV
# Share of Manafa outstanding in one rating.
max_single_rating_share = "0.15"
